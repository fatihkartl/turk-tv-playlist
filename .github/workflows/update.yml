name: Update Turkish TV playlists

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "channels.json"
      - "update_playlist.py"
      - "update_epg.py"
      - ".github/workflows/update.yml"

concurrency:
  group: turk-tv-playlist-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: |
          python -m py_compile update_playlist.py
          python -m py_compile update_epg.py

      - name: Build and health-check playlists
        run: python update_playlist.py

      - name: Build filtered EPG
        run: python update_epg.py

      - name: Show health summary
        run: |
          python - <<'PY'
          import json
          r = json.load(open("health_report.json", encoding="utf-8"))
          print(json.dumps(r["summary"], ensure_ascii=False, indent=2))
          PY

      - name: Commit changes if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turkiye_temiz.m3u turkiye_fhd_auto.m3u epg_turkiye.xml health_report.json
          git diff --cached --quiet || git commit -m "Auto-update verified Turkish TV playlists"
          git push
